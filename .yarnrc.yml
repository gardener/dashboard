approvedGitRepositories: []

compressionLevel: 0

enableGlobalCache: false

enableScripts: false

enableTelemetry: false

enableTransparentWorkspaces: false

immutablePatterns:
  - .pnp.*

logFilters:
  - code: YN0005
    level: discard
  - code: YN0086
    level: discard
  - code: YN0002
    level: discard
    text: "doesn't provide typescript (*, requested by @vitest/eslint-plugin"
  - code: YN0060
    level: discard
    text: "eslint-plugin-import"
  - code: YN0060
    level: discard
    text: "@typescript-eslint/utils"

packageExtensions:
  "@pinia/testing@*":
    peerDependencies:
      vue: "*"
  "@vue/test-utils@*":
    dependencies:
      "@vue/compiler-dom": "*"
      "@vue/server-renderer": "*"
  "eslint-plugin-import@*":
    peerDependenciesMeta:
      "eslint":
        optional: true
  "typescript-eslint@*":
    peerDependenciesMeta:
      "typescript":
        optional: true

plugins:
  - path: .yarn/plugins/plugin-prod-install.cjs

pnpEnableEsmLoader: true

supportedArchitectures:
  cpu:
    - x64
    - arm64
    - arm64-musl
  libc:
    - musl
    - glibc
  os:
    - linux
    - darwin

yarnPath: .yarn/releases/yarn-4.17.1.cjs
